name: Healthvision
description: Healthvision was a healthcare-IT software and services company based in Irving, Texas,
  that provided access to healthcare information to improve clinical and financial outcomes for public
  and private healthcare organizations. It was formed in 2007 through Battery Ventures' take-private
  acquisition of Quovadx (NASDAQ QVDX) and its Integration Solutions Division, and was subsequently
  acquired by Lawson Software (now part of Infor). The company no longer operates as an independent
  entity and publishes no live developer portal, documentation, or public API surface; this profile is
  retained as a historical portfolio-lead record rather than an active API provider.
